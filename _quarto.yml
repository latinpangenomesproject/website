project:
  type: website
  output-dir: _site

website:
  title: "Latin Pangenomes Project"
  description: "A pangenome and structural-variant catalog built from Indigenous and admixed ancestries across Latin America."
  repo-url: "https://github.com/latinpangenomeproject/"   # TODO
  favicon: assets/favicon.svg
  search: true
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  navbar:
    logo: assets/logo.svg
    title: "Latin Pangenomes"
    left:
      - text: "Research"
        href: research.qmd
      - text: "Data"
        href: data.qmd
      - text: "Team"
        href: team.qmd
      - text: "News"
        href: news/index.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: github
        href: "https://github.com/latinpangenomesproject/"
        aria-label: GitHub
  page-footer:
    left: |
      
    right: |


format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [cosmo, styles/dark.scss]
    respect-user-color-scheme: true
    css: styles/extra.css
    toc: true
    toc-location: right
    toc-title: "On this page"
    fig-cap-location: bottom
    link-external-newwindow: true
    smooth-scroll: true
    code-tools: false
    echo: false
    mermaid:
      theme: neutral
